apiVersion: apps/v1
kind: Deployment
metadata:
  name: tebak-angka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tebak-angka
  template:
    metadata:
      labels:
        app: tebak-angka
    spec:
      containers:
        - name: tebak-angka
          image: cathhhhh/tebak-angka:1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000